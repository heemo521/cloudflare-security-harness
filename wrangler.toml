name = "security-harness"
main = "src/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

# Route the harness in front of your origin. Either:
#  (a) attach it to a zone route and let it fetch the origin on the same hostname, or
#  (b) set ORIGIN_URL to proxy to an explicit upstream.
# routes = [{ pattern = "app.example.com/*", zone_name = "example.com" }]

[observability]
enabled = true

[vars]
# Set to an absolute URL to proxy (e.g. "https://origin.example.com"). Leave empty
# to pass the request through to the zone origin unchanged.
ORIGIN_URL = ""

# Full policy as JSON. Every key is optional; see src/config.ts for defaults.
HARNESS_CONFIG = """
{
  "allowedMethods": ["GET", "HEAD", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"],
  "maxBodyBytes": 1048576,
  "ipDeny": [],
  "ipAllow": [],
  "blockedCountries": [],
  "allowedCountries": [],
  "bot": { "scoreThreshold": 0, "allowVerifiedBots": true },
  "rateLimit": { "enabled": true, "requests": 100, "windowSeconds": 60, "keyBy": "ip" },
  "waf": { "enabled": true, "blockSqli": true, "blockXss": true, "blockTraversal": true, "blockedPaths": ["/.env", "/.git", "/wp-admin", "/phpmyadmin"] },
  "access": { "enabled": false, "teamDomain": "", "aud": "", "paths": ["/admin"] },
  "bearer": { "enabled": false, "paths": ["/api"] },
  "cors": { "enabled": false, "origins": [], "methods": ["GET", "POST", "OPTIONS"], "headers": ["Content-Type", "Authorization"], "maxAge": 600 },
  "headers": {
    "hsts": "max-age=31536000; includeSubDomains; preload",
    "csp": "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'",
    "frameOptions": "DENY",
    "referrerPolicy": "strict-origin-when-cross-origin",
    "permissionsPolicy": "camera=(), microphone=(), geolocation=()"
  }
}
"""

# Secrets (set with `wrangler secret put <NAME>`), never in this file:
#   API_TOKEN  - bearer token required by the `bearer` control

# Rate limiting binding (Workers Rate Limiting API). When absent the harness falls
# back to a per-isolate in-memory limiter, which is fine for local dev only.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

# Optional: Analytics Engine dataset for audit events.
# [[analytics_engine_datasets]]
# binding = "AUDIT"
# dataset = "security_harness_audit"
